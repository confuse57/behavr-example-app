<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Customer Support · BEHAVR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">B</span>
      <span>AI Customer Support</span>
    </div>
    <span class="powered">Powered by BEHAVR memory</span>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-head">
        <span class="step">1</span>
        <div>
          <h2>Customer Support — Upload</h2>
          <p class="hint">Save a product photo to this customer's memory.</p>
        </div>
      </div>

      <form id="upload-form">
        <label for="customer-id">Customer ID</label>
        <input id="customer-id" type="text" value="customer_001" placeholder="customer_001" autocomplete="off" required />

        <label for="file">Image</label>
        <label class="dropzone" for="file">
          <input id="file" type="file" accept="image/*" required />
          <img id="preview" alt="" hidden />
          <span id="file-label">Click to choose an image</span>
        </label>

        <button type="submit" id="upload-btn">
          <span class="spinner" hidden></span>
          <span class="btn-text">Upload</span>
        </button>
      </form>
      <div id="upload-result" class="result" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="step">2</span>
        <div>
          <h2>Ask About This Customer</h2>
          <p class="hint">Answers come only from <strong id="ask-customer">customer_001</strong>'s memories.</p>
        </div>
      </div>

      <form id="ask-form">
        <label for="question">Question</label>
        <input id="question" type="text" placeholder="What product did this customer upload?" autocomplete="off" required />

        <button type="submit" id="ask-btn">
          <span class="spinner" hidden></span>
          <span class="btn-text">Ask</span>
        </button>
      </form>
      <div id="ask-result" class="result" hidden></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
